<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1090" viewBox="0 0 760 1090" role="img" aria-labelledby="title"><title id="title">数据、冷启动、PPO、对照训练与保留测试的拟议实验流程</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#75838d"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="760" height="1090" fill="#fcfbf7"/><text x="380" y="45" font-size="30" font-weight="600" fill="#25313b" text-anchor="middle">迁移实验：从数据到判别证据</text><rect x="45" y="85" width="670" height="125" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="380.0" y="119" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">E0  接口与数据</text><text x="380.0" y="151" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">三项任务；每任务两条开发演示重放</text><text x="380.0" y="179" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">检查图像对齐、坐标系、JSON 和成功判定</text><path d="M380 215 V238" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="245" width="670" height="125" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="380.0" y="279" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">E1  双模式冷启动</text><text x="380.0" y="311" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">共享动作标签，派生长短说明或空思考</text><text x="380.0" y="339" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">确认两种模式均可完整生成并执行动作</text><path d="M380 375 V398" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="405" width="670" height="125" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="380.0" y="439" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">E2  PPO 链路探针</text><text x="380.0" y="471" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">4 回合 / 批 × 10 次更新；先核对概率</text><text x="380.0" y="499" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">检查优势、价值目标与采样 mask</text><path d="M380 535 V558" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="565" width="670" height="125" rx="9" fill="#f4e9df" stroke="#b8c4cc"/><text x="380.0" y="599" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">E3  对照训练与配置</text><text x="380.0" y="631" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">学习策略统一采样量；固定策略登记成本</text><text x="380.0" y="659" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">开发集选配置，记录额外采样与训练成本</text><path d="M380 695 V718" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="725" width="670" height="125" rx="9" fill="#f4e9df" stroke="#b8c4cc"/><text x="380.0" y="759" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">E4  冻结测试</text><text x="380.0" y="791" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">3 任务 × 10 初态 × 3 次独立重复 = 90 回合</text><text x="380.0" y="819" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">学习策略重训；固定策略用对应评测种子</text><path d="M380 856 V885 H195 V905" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M380 885 H565 V905" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="910" width="300" height="105" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="195.0" y="944" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">正常任务</text><text x="195.0" y="976" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">完整成功 / p95 时延</text><rect x="415" y="910" width="300" height="105" rx="9" fill="#f4e9df" stroke="#b8c4cc"/><text x="565.0" y="944" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">受控扰动</text><text x="565.0" y="976" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">抓空 / 目标移位 / 恢复</text><text x="380" y="1065" font-size="20" font-weight="400" fill="#65727b" text-anchor="middle">拟议实验流程；图中不包含实测结果</text></svg>