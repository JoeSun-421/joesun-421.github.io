<svg xmlns="http://www.w3.org/2000/svg" width="760" height="880" viewBox="0 0 760 880" role="img" aria-labelledby="title"><title id="title">冻结路由先导的六组预算对照与联合语言策略的损失处理消融</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#75838d"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="760" height="880" fill="#fcfbf7"/><text x="380" y="45" font-size="30" font-weight="600" fill="#25313b" text-anchor="middle">统一底座下的预算与反馈对照</text><rect x="45" y="85" width="670" height="95" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="380.0" y="119" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">共享控臂 SFT 底座</text><text x="380.0" y="151" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">路由器先导冻结底座；测试协议保持一致</text><path d="M380 186 V640" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="230" width="300" height="105" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="195.0" y="264" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">A  固定短</text><text x="195.0" y="296" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">全程 short</text><rect x="415" y="230" width="300" height="105" rx="9" fill="#f4e9df" stroke="#b8c4cc"/><text x="565.0" y="264" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">B  固定长</text><text x="565.0" y="296" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">全程 long</text><path d="M375 282 H350" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M385 282 H409" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="380" width="300" height="105" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="195.0" y="414" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">C  随机预算</text><text x="195.0" y="446" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">开发集匹配平均算量</text><rect x="415" y="380" width="300" height="105" rx="9" fill="#f4e9df" stroke="#b8c4cc"/><text x="565.0" y="414" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">D  置信 / 难度</text><text x="565.0" y="446" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">DEER / DyCon 迁移</text><path d="M375 432 H350" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M385 432 H409" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="530" width="300" height="105" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="195.0" y="564" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">E  无反馈 PPO</text><text x="195.0" y="596" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">去掉执行反馈</text><rect x="415" y="530" width="300" height="105" rx="9" fill="#f4e9df" stroke="#b8c4cc"/><text x="565.0" y="564" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">F  有反馈 PPO</text><text x="565.0" y="596" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">当前观测 + 实际反馈</text><path d="M375 582 H350" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M385 582 H409" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="680" width="670" height="120" rx="9" fill="#f4e9df" stroke="#b8c4cc"/><text x="380.0" y="714" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">联合语言策略阶段</text><text x="380.0" y="746" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">普通平均 / 模式项加权 / 阶段决策 mask</text><text x="380.0" y="774" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">相同冷启动、数据、奖励与训练预算</text><text x="380" y="850" font-size="20" font-weight="400" fill="#65727b" text-anchor="middle">SLM 在联合 token 策略中比较；路由器先导单独评测</text></svg>