<svg xmlns="http://www.w3.org/2000/svg" width="760" height="835" viewBox="0 0 760 835" role="img" aria-labelledby="title"><title id="title">冻结底座条件下的 rollout、GAE 与路由 PPO 更新闭环</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#75838d"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="760" height="835" fill="#fcfbf7"/><text x="380" y="45" font-size="30" font-weight="600" fill="#25313b" text-anchor="middle">一次路由 PPO 更新</text><text x="380" y="78" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">冻结动作底座；训练预算选择器与价值头</text><rect x="45" y="120" width="290" height="112" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="190.0" y="154" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">① 训练初态</text><text x="190.0" y="186" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">图像、本体状态、历史</text><rect x="45" y="290" width="290" height="112" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="190.0" y="324" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">② 旧策略采样</text><text x="190.0" y="356" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">模式 + old log-prob</text><rect x="45" y="460" width="290" height="112" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="190.0" y="494" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">③ 执行一轮</text><text x="190.0" y="526" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">JSON → 控制器 → 新反馈</text><text x="190.0" y="554" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">未终止回②；终止进④</text><rect x="45" y="630" width="290" height="112" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="190.0" y="664" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">④ 完整回合记录</text><text x="190.0" y="696" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">逐轮 log-prob / old value</text><text x="190.0" y="724" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">终局成功与每轮成本</text><rect x="425" y="120" width="290" height="112" rx="9" fill="#f4e9df" stroke="#b8c4cc"/><text x="570.0" y="154" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">⑧ 刷新采样快照</text><text x="570.0" y="186" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">进入下一批 rollout</text><rect x="425" y="290" width="290" height="112" rx="9" fill="#f4e9df" stroke="#b8c4cc"/><text x="570.0" y="324" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">⑦ PPO 参数更新</text><text x="570.0" y="356" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">clip surrogate + value loss</text><rect x="425" y="460" width="290" height="112" rx="9" fill="#f4e9df" stroke="#b8c4cc"/><text x="570.0" y="494" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">⑥ 重算策略概率</text><text x="570.0" y="526" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">同一模式的 new log-prob</text><rect x="425" y="630" width="290" height="112" rx="9" fill="#f4e9df" stroke="#b8c4cc"/><text x="570.0" y="664" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">⑤ 计算训练目标</text><text x="570.0" y="696" font-size="21" font-weight="400" fill="#65727b" text-anchor="middle">即时奖励 → GAE → 回报</text><path d="M190 236 V284" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570 284 V236" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M190 406 V454" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570 454 V406" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M190 576 V624" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570 624 V576" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M40 516 H16 V346 H40" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M340 686 H419" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M419 176 H341" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="805" font-size="20" font-weight="400" fill="#65727b" text-anchor="middle">观测与强制标记只作条件；old log-prob 保持不变</text></svg>