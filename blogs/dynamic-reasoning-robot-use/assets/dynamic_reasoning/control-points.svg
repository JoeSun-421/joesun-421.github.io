<svg xmlns="http://www.w3.org/2000/svg" width="760" height="575" viewBox="0 0 760 575" role="img" aria-labelledby="title"><title id="title">模式选择、生成中停止与反馈后的预算重分配</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#75838d"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="760" height="575" fill="#fcfbf7"/><text x="380" y="48" font-size="30" font-weight="600" fill="#25313b" text-anchor="middle">动态推理的三个控制位置</text><text x="20" y="137" font-size="23" font-weight="600" fill="#25313b" text-anchor="start">生成前</text><text x="20" y="167" font-size="15" font-weight="400" fill="#65727b" text-anchor="start">Thinkless / TON</text><rect x="180" y="100" width="170" height="90" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="265.0" y="134" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">输入 x</text><rect x="370" y="100" width="170" height="90" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="455.0" y="134" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">选择模式 m</text><rect x="560" y="100" width="170" height="90" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="645.0" y="134" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">回答 y</text><path d="M350 145 H367" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M540 145 H557" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="20" y="287" font-size="23" font-weight="600" fill="#25313b" text-anchor="start">生成中</text><text x="20" y="317" font-size="15" font-weight="400" fill="#65727b" text-anchor="start">DEER / DyCon</text><rect x="180" y="250" width="170" height="90" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="265.0" y="284" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">当前推理前缀</text><rect x="370" y="250" width="170" height="90" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="455.0" y="284" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">置信度 / 难度</text><rect x="560" y="250" width="170" height="90" rx="9" fill="#e9eff4" stroke="#b8c4cc"/><text x="645.0" y="284" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">继续或结束</text><path d="M350 295 H367" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M540 295 H557" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="20" y="437" font-size="23" font-weight="600" fill="#25313b" text-anchor="start">执行后</text><text x="20" y="467" font-size="15" font-weight="400" fill="#65727b" text-anchor="start">Robot-use 设计</text><rect x="180" y="400" width="170" height="90" rx="9" fill="#f4e9df" stroke="#b8c4cc"/><text x="265.0" y="434" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">新观测与反馈</text><rect x="370" y="400" width="170" height="90" rx="9" fill="#f4e9df" stroke="#b8c4cc"/><text x="455.0" y="434" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">重新分配预算</text><rect x="560" y="400" width="170" height="90" rx="9" fill="#f4e9df" stroke="#b8c4cc"/><text x="645.0" y="434" font-size="25" font-weight="600" fill="#25313b" text-anchor="middle">下一次动作</text><path d="M350 445 H367" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M540 445 H557" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M645 492 V523 H265 V493" fill="none" stroke="#75838d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="455" y="550" font-size="20" font-weight="400" fill="#65727b" text-anchor="middle">执行结果进入下一轮上下文</text></svg>